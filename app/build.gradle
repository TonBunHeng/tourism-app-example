plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.smarttourismapp'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.smarttourismapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:8000/api/travel/\""
        }
        release {
            minifyEnabled false
            buildConfigField "String", "BASE_URL", "\"https://angkorvers.vercel.app/api/travel/\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Network & Serialization (Matching web axios + backend REST API)
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging

    // Security & EncryptedSharedPreferences
    implementation libs.androidx.security.crypto

    // Architecture Components (MVVM: ViewModel & LiveData)
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata

    // SwipeRefreshLayout
    implementation libs.androidx.swiperefreshlayout

    // Image loading
    implementation libs.glide

    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation "com.tbuonomo:dotsindicator:4.3"

    // Google Sign-In SDK
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Facebook Login SDK
    implementation 'com.facebook.android:facebook-login:17.0.0'
}